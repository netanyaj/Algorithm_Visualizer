name: Build pygame-web (WASM)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pybag
        run: |
          pip install pybag

      - name: Build web version
        run: |
          python -m pybag build --web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pygame-web-build
          path: build/
