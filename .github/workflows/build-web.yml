name: Build pygame-web (WASM)

on:
  push:
    branches:
      - main
      - pybag
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pybag
        run: |
          pip install pybag --no-deps

      - name: Patch pybag winreg import
        run: |
          PYBAG_DIR=$(python - <<EOF
          import pybag, os
          print(os.path.dirname(pybag.__file__))
          EOF
          )
          sed -i 's/^import winreg$/if False:\\n    import winreg/' "$PYBAG_DIR/__init__.py"

      - name: Build web version
        run: |
          python -m pybag build --web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pygame-web-build
          path: build/
